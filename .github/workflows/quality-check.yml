name: Quality Checks

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --pretty false --incremental false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  request-review:
    name: Request review
    needs: verify
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PR_REVIEWER != '' &&
      github.event.pull_request.user.login != vars.PR_REVIEWER
    runs-on: ubuntu-latest
    steps:
      - name: Request review from the configured reviewer
        uses: actions/github-script@v7
        env:
          PR_REVIEWER: ${{ vars.PR_REVIEWER }}
        with:
          script: |
            const reviewer = process.env.PR_REVIEWER;
            const pullRequest = context.payload.pull_request;

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              reviewers: [reviewer],
            });
